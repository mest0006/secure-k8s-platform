replicaCount: 2

image:
  repository: ghcr.io/mest0006/hello-api
  # Deploy by digest. CI sets this to the sha256 digest of the scanned image.
  # A tag is only used when no digest is given, and "latest" is rejected by policy.
  digest: ""
  tag: "0.1.0"
  pullPolicy: IfNotPresent

greeting: "hello from hello-api"

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

podDisruptionBudget:
  minAvailable: 1

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the service (ingress controller, monitoring).
  allowedNamespaces:
    - ingress-nginx
    - monitoring

serviceMonitor:
  enabled: false   # turn on when the Prometheus Operator CRDs are installed
