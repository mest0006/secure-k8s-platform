apiVersion: v1
kind: Service
metadata:
  name: {{ include "hello-api.name" . }}
  labels:
    {{- include "hello-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hello-api.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
