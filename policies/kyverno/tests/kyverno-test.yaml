apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-policies
policies:
  - ../disallow-latest-tag.yaml
  - ../require-pod-security.yaml
  - ../require-requests-limits.yaml
  - ../restrict-image-registries.yaml
resources:
  - resources.yaml
results:
  - {policy: disallow-latest-tag, rule: require-image-tag-or-digest, resources: [good-pod, latest-pod, root-pod], kind: Pod, result: pass}
  - {policy: disallow-latest-tag, rule: disallow-latest, resources: [good-pod, root-pod], kind: Pod, result: pass}
  - {policy: disallow-latest-tag, rule: disallow-latest, resources: [latest-pod], kind: Pod, result: fail}
  - {policy: require-pod-security, rule: run-as-non-root, resources: [good-pod, latest-pod], kind: Pod, result: pass}
  - {policy: require-pod-security, rule: run-as-non-root, resources: [root-pod], kind: Pod, result: fail}
  - {policy: require-pod-security, rule: harden-containers, resources: [good-pod, latest-pod], kind: Pod, result: pass}
  - {policy: require-pod-security, rule: harden-containers, resources: [root-pod], kind: Pod, result: fail}
  - {policy: require-requests-limits, rule: validate-resources, resources: [good-pod, latest-pod], kind: Pod, result: pass}
  - {policy: require-requests-limits, rule: validate-resources, resources: [root-pod], kind: Pod, result: fail}
  - {policy: restrict-image-registries, rule: allowed-registries, resources: [good-pod, latest-pod], kind: Pod, result: pass}
  - {policy: restrict-image-registries, rule: allowed-registries, resources: [root-pod], kind: Pod, result: fail}
