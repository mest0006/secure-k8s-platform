# Containers must run as non-root, without privilege escalation, with all
# Linux capabilities dropped and a read-only root filesystem.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-security
  annotations:
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "Pods must set runAsNonRoot: true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: harden-containers
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "Containers must disable privilege escalation, drop ALL capabilities and use a read-only root filesystem."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
