name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hello-api

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app-tests:
    name: App unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s app/tests -v

  iac:
    name: Terraform fmt, validate, Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive terraform
      - name: terraform validate (dev env, no backend)
        working-directory: terraform/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          # Report findings without failing the build; triaged findings are
          # tracked in docs/security.md.
          soft_fail: true

  k8s-manifests:
    name: Helm lint + Kyverno policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: kyverno/action-install-cli@v0.2.0
        with:
          release: v1.13.2
      - run: helm lint charts/hello-api
      - run: helm template hello-api charts/hello-api > rendered.yaml
      - name: Policy unit tests
        run: kyverno test policies/kyverno/tests
      - name: Rendered chart must pass every policy
        run: |
          kyverno apply \
            policies/kyverno/disallow-latest-tag.yaml \
            policies/kyverno/require-pod-security.yaml \
            policies/kyverno/require-requests-limits.yaml \
            policies/kyverno/restrict-image-registries.yaml \
            --resource rendered.yaml
      - name: Prometheus rules check
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz | tar xz
          ./prometheus-2.54.1.linux-amd64/promtool check rules observability/alerts/*.yaml

  image:
    name: Build, scan, push (by digest)
    runs-on: ubuntu-latest
    needs: [secrets-scan, app-tests, k8s-manifests]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: app
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL with a fix)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Record deployable digest
        if: steps.build.outputs.digest != ''
        run: echo "Deploy with image.digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Deploy to kind + smoke test + rollback
    runs-on: ubuntu-latest
    needs: [app-tests, k8s-manifests]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ci
      - name: Build and load image into kind
        run: |
          docker build -t "${IMAGE}:ci" app
          kind load docker-image "${IMAGE}:ci" --name ci
      - name: Install chart (v1)
        run: |
          helm install hello-api charts/hello-api \
            --set image.tag=ci --set networkPolicy.enabled=false \
            --wait --timeout 120s
      - name: Smoke test
        run: scripts/smoke-test.sh
      - name: Upgrade with a broken image, then roll back automatically
        run: |
          set +e
          helm upgrade hello-api charts/hello-api \
            --set image.tag=does-not-exist --set networkPolicy.enabled=false \
            --atomic --wait --timeout 60s
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then echo "expected the broken upgrade to fail"; exit 1; fi
          helm history hello-api
          scripts/smoke-test.sh
